services:
  api:
    build: .
    container_name: rdrs-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
    restart: unless-stopped

  monitor:
    build: .
    container_name: rdrs-monitor
    command: ["python", "-m", "app.main"]
    environment:
      RDRS_POLLING: "1"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
    restart: unless-stopped
